[project]
name = "visionsynth"
version = "0.1.0"
description = "Generate synthetic text-in-image data for OCR/VLM training."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siba prasad sahu" }]
keywords = ["ocr", "synthetic-data", "vlm", "image-generation", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.30.0",
    "noise>=1.2.2",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "pandas>=3.0.5",
    "pillow>=11.3.0",
    "scipy>=1.16.2",
]

[project.urls]
Repository = "https://github.com/Siba4442/SytheticImageDataGenerator"

[project.scripts]
visionsynth = "visionsynth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["cv2.*", "noise.*", "datasets.*", "huggingface_hub.*", "pandas.*"]
ignore_missing_imports = true
